<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow | Professional Task Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-dim: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--text);
            line-height: 1.6;
            padding: 2rem;
        }

        .container { max-width: 800px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 3rem; }
        h1 { font-size: 2.5rem; font-weight: 600; margin-bottom: 0.5rem; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .task-form { 
            background: var(--card); 
            padding: 2rem; 
            border-radius: 1rem; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            margin-bottom: 2rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        input, select, textarea {
            background: #334155;
            border: 1px solid #475569;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            flex: 1;
            min-width: 200px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus { border-color: var(--primary); }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .task-list { display: grid; gap: 1rem; }

        .task-card {
            background: var(--card);
            padding: 1.5rem;
            border-radius: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid var(--primary);
            transition: transform 0.2s;
        }

        .task-card:hover { transform: scale(1.01); }

        .task-info h3 { margin-bottom: 0.25rem; font-size: 1.1rem; }
        .task-info p { color: var(--text-dim); font-size: 0.9rem; }

        .task-actions { display: flex; gap: 0.5rem; }

        .completed { opacity: 0.5; border-left-color: #10b981; }
        .completed h3 { text-decoration: line-through; }

        .badge {
            font-size: 0.7rem;
            padding: 0.25rem 0.5rem;
            border-radius: 1rem;
            background: #475569;
            margin-left: 0.5rem;
            vertical-align: middle;
        }

        .delete-btn { background: #ef4444; }
        .complete-btn { background: #10b981; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>TaskFlow</h1>
            <p style="color: var(--text-dim)">Manage your work with style.</p>
        </header>

        <div class="task-form">
            <input type="text" id="title" placeholder="What needs to be done?" required>
            <input type="text" id="description" placeholder="Description (optional)">
            <select id="category">
                <option value="Others">Category</option>
                <option value="Work">Work</option>
                <option value="Personal">Personal</option>
                <option value="Urgent">Urgent</option>
            </select>
            <button onclick="createTask()">Add Task</button>
        </div>

        <div id="tasks" class="task-list">
            <!-- Tasks will appear here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
